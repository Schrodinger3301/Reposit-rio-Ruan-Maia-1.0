<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7 - Somar Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <header class="card-reader">
            <h1 class="card-title">Somadora</h1>
            <p class="card-subtitle">Clique no botão para ver a mensagem</p>
        </header>
        
        <div class="form-group">
            <input type="number" id="num1" class="input-field" placeholder="Primeiro número">
        </div>
        <div class="form-group">
            <input type="number" id="num2" class="input-field" placeholder="Segundo número">
        </div>
        <div class="form-group">
            <button id="btn-somar" class="btn btn success">Somar</button>
        </div>

        <div class="btn-group">
            <button id="btn-toggle" class="btn">Mostrar Mensagem</button>
        </div>

        <div id="resultado" class="counter-dislay text-muted">0</div>
    </main>
    <script src="script7.js"></script>
</body>
</html>
