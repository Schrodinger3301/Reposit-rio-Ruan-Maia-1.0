<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 05 - Tabela</title>
</head>
<body style="background-color: black;">
    <h1 style="color: white;">Tabela de Estastística</h1>
    <br>
    <table border="1"; style="background-color: lightgreen;"> <!--Tabela (Coluna e Linha)-->
        <thead>
            <tr>
                <th>Tipo Atacante</th>
                <th>Super efetivo</th>
                <th>Pouco efetivo</th>
                <th>Sem Efeito</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Fogo</td>
                <td>grama,gelo,inseto,aço</td>
                <td>agua,fogo,pedra,dragão</td>
                <td>0%</td>
            </tr>
             <tr>
                <td>Água</td>
                <td>fogo,terra,pedra</td>
                <td>agua,grama,velocidade</td>
                <td>0%</td>
            </tr>
             <tr>
                <td>Elétrico</td>
                <td>água,voador</td>
                <td>elétrico,voraz,teimoso</td>
                <td>0%</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
