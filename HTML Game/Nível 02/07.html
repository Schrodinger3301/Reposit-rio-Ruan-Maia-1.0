<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletor de Região</title>
</head>
<body>
   <h1>Origem da Sua Jornada</h1>
   <br>
   <form>
    <p>
        <label for="origem">Escolha a sua Região:</label>
        <select name="origem" id="origem">
            <option value="Manacapuru">Manacapuru</option>
            <option value="Norte">Norte</option>
            <option value="Oeste">Oeste</option>
            <option value="Sul">Sul</option>
        </select>
    </p>
    <br>
    <h4>Escolha seu estilo de Treinamento</h4>
    <div>
        <input type="radio" id="Batalhador" name="estilo" value="batalha" checked>
        <label for="Batalhador">Desafiante de Ginásio(Líderes e Liga)</label>
    </div>
    <br>
    <div>
        <input type="radio" id="Coordenador" name="estilo" value="contest" >
        <label for="Coordenador">Coordenador Pokémon</label>
    </div>
    <br>
    <div>
        <input type="radio" id="Criador" name="estilo" value="criar">
        <label for="Criador">Criador ou Pesquisador Pokémon </label>
    </div>
    <br>
    <fieldset>
        <legend>Assistente de Batalhas</legend>
        <p>
            <div>
        <input type="checkbox" id="animações" name="animações">
        <label for="Animaçõesr">Exibir animações de golpes</label
        </p>
        <p>
            <div>
        <input type="checkbox" id="estilo-batalha" name="estilo-batalha">
        <label for="estilo-batalha">Modo Troca Livre</label
        </p>
    </fieldset>

   </form>
</body>
</html>
