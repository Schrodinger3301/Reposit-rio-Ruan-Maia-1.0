<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela da Conta Jogador</title>
</head>
<body>
    <h1>Registro de Treinador - Pokémon</h1>
    <!--comando de furmulario-->
    <form action="/registrar" method="post"></form>
    <div><!--Divisoria nome-->
        <label for="trainer-name">Nome do Treinador</label>
        <input type="text" id="trainer-name" placeholder="Ex: nome" required>

    </div>
    <br>
    <div><!--Divisoria email-->
        <label for="trainer-email">Email</label>
        <input type="email" id="trainer-email" placeholder="Ex: nome" required>
        
    </div>
    <br>
    <div><!--Divisoria senha-->
        <label for="trainer-pin">Senha de Acesso</label>
        <input type="password" id="trainer-pin" name="trainer-pin" minlength="4">
        
    </div>
    <br>
    <button type="submit">Enviar cadastro</button>
</body>
</html>
